openapi: 3.0.3
info:
  title: Clinic Scheduler API
  version: 1.0.0
  description: >
    A fictional clinic appointment scheduler used as the shared teaching repo
    for the Claude Code Summit 2026.

    SYNTHETIC DATA ONLY - NO PHI. Provider names are fictional, locations are
    made up, and bookings use opaque codes like "PT-0001". This API has no field
    for, and must never hold, real patient information.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: providers
  - name: slots
  - name: bookings
  - name: reports
  - name: meta
paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /providers:
    get:
      tags: [providers]
      summary: List all providers
      responses:
        '200':
          description: Array of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
  /providers/{id}/slots:
    get:
      tags: [providers]
      summary: List a provider's slots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Provider id
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, booked]
          description: Optional status filter
      responses:
        '200':
          description: Array of slots for the provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          description: Invalid provider id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /slots:
    get:
      tags: [slots]
      summary: List slots, optionally filtered by date and/or specialty
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter to slots starting on this calendar day (YYYY-MM-DD, UTC)
        - name: specialty
          in: query
          required: false
          schema:
            type: string
          description: Filter by the slot provider's specialty
      responses:
        '200':
          description: Array of slots (each includes the provider specialty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotWithSpecialty'
  /bookings:
    post:
      tags: [bookings]
      summary: Book an available slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id, holder_ref]
              properties:
                slot_id:
                  type: integer
                  example: 2
                holder_ref:
                  type: string
                  description: Opaque synthetic code. NOT a name or contact detail.
                  example: PT-0001
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slot is already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}:
    delete:
      tags: [bookings]
      summary: Cancel a booking and free its slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Booking id
      responses:
        '204':
          description: Cancelled (no content)
        '400':
          description: Invalid booking id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports:
    get:
      tags: [reports]
      summary: Index of every report endpoint
      responses:
        '200':
          description: Report envelope whose data lists all report endpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          endpoints:
                            type: array
                            items:
                              type: string
  /reports/utilization:
    get:
      tags: [reports]
      summary: Overall utilization plus a by-specialty breakdown
      responses:
        '200':
          description: Report envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          overall:
                            $ref: '#/components/schemas/UtilizationOverall'
                          by_specialty:
                            type: array
                            items:
                              $ref: '#/components/schemas/UtilizationRow'
  /reports/utilization/by-provider:
    get:
      tags: [reports]
      summary: Utilization per provider
      responses:
        '200':
          description: Report envelope; data is an array of utilization rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/utilization/by-location:
    get:
      tags: [reports]
      summary: Utilization per location
      responses:
        '200':
          description: Report envelope; data is an array of utilization rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/utilization/by-day:
    get:
      tags: [reports]
      summary: Utilization per calendar day
      responses:
        '200':
          description: Report envelope; data is an array of utilization rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/utilization/summary.txt:
    get:
      tags: [reports]
      summary: Plain-text utilization summary
      responses:
        '200':
          description: Human-readable text table
          content:
            text/plain:
              schema:
                type: string
  /reports/revenue:
    get:
      tags: [reports]
      summary: Fabricated revenue total plus a by-specialty breakdown
      description: Revenue figures are synthetic demo numbers, not real billing.
      responses:
        '200':
          description: Report envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: number
                          total_label:
                            type: string
                          by_specialty:
                            type: array
                            items:
                              $ref: '#/components/schemas/RevenueRow'
  /reports/revenue/by-provider:
    get:
      tags: [reports]
      summary: Fabricated revenue per provider
      responses:
        '200':
          description: Report envelope; data is an array of revenue rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/revenue/by-location:
    get:
      tags: [reports]
      summary: Fabricated revenue per location
      responses:
        '200':
          description: Report envelope; data is an array of revenue rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/revenue/by-day:
    get:
      tags: [reports]
      summary: Fabricated revenue per day over a window
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Report envelope; data is an array of per-day revenue rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/revenue/summary.txt:
    get:
      tags: [reports]
      summary: Plain-text revenue summary
      responses:
        '200':
          description: Human-readable text table
          content:
            text/plain:
              schema:
                type: string
  /reports/capacity:
    get:
      tags: [reports]
      summary: Forward-looking availability for the next N days
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Report envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            $ref: '#/components/schemas/CapacitySummary'
                          by_specialty:
                            type: array
                            items:
                              type: object
                              properties:
                                specialty:
                                  type: string
                                available_slots:
                                  type: integer
  /reports/capacity/by-day:
    get:
      tags: [reports]
      summary: Available slots per day for the next N days
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Report envelope; data is an array of per-day availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/capacity/by-weekday:
    get:
      tags: [reports]
      summary: Available slots per weekday for the next N days
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Report envelope; data is an array keyed by weekday
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/capacity/by-hour:
    get:
      tags: [reports]
      summary: Available slots per hour-of-day for the next N days
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Report envelope; data is an array keyed by hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
  /reports/capacity/summary.txt:
    get:
      tags: [reports]
      summary: Plain-text capacity summary
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Human-readable text table
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Provider:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Dr. A. Rivera
        specialty:
          type: string
          example: Cardiology
    Slot:
      type: object
      properties:
        id:
          type: integer
          example: 2
        provider_id:
          type: integer
          example: 1
        location_id:
          type: integer
          example: 1
        start_time:
          type: string
          format: date-time
          example: '2026-06-22T09:00:00.000Z'
        duration_min:
          type: integer
          example: 30
        status:
          type: string
          enum: [available, booked]
          example: available
    SlotWithSpecialty:
      allOf:
        - $ref: '#/components/schemas/Slot'
        - type: object
          properties:
            specialty:
              type: string
              example: Cardiology
    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slot_id:
          type: integer
          example: 2
        holder_ref:
          type: string
          example: PT-0001
    Error:
      type: object
      properties:
        error:
          type: string
          example: slot 2 is already booked
    ReportEnvelope:
      type: object
      description: Common wrapper every /reports endpoint returns.
      properties:
        report:
          type: string
          example: utilization.overall
        generated_at:
          type: string
          format: date-time
        disclaimer:
          type: string
          example: Synthetic demo data — NO PHI. Figures are fabricated for teaching.
        params:
          type: object
        data:
          description: Endpoint-specific payload (object or array).
    UtilizationOverall:
      type: object
      properties:
        total_slots:
          type: integer
        booked_slots:
          type: integer
        available_slots:
          type: integer
        utilization_pct:
          type: number
          example: 25
        utilization_label:
          type: string
          example: 25.0%
    UtilizationRow:
      type: object
      properties:
        specialty:
          type: string
          example: Cardiology
        total_slots:
          type: integer
        booked_slots:
          type: integer
        available_slots:
          type: integer
        utilization_pct:
          type: number
        utilization_label:
          type: string
    RevenueRow:
      type: object
      properties:
        specialty:
          type: string
          example: Cardiology
        booked_slots:
          type: integer
        unit_price:
          type: number
          example: 320
        unit_price_label:
          type: string
          example: $320.00
        revenue:
          type: number
        revenue_label:
          type: string
    CapacitySummary:
      type: object
      properties:
        window_days:
          type: integer
          example: 14
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        total_slots:
          type: integer
        available_slots:
          type: integer
        booked_slots:
          type: integer
  parameters:
    Days:
      name: days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 14
      description: Size of the forward window in days (1-90, default 14)
